# Push a tag equal to manifest.json's version (no leading "v"): checks, builds and publishes a release with
# main.js, manifest.json and styles.css — what BRAT downloads. Tags like 0.3.0-beta.1 become prereleases.
# Or run it by hand (Actions → Release → Run workflow): it releases manifest.json's version from the chosen branch and
# creates that tag; it stops if the tag already exists.
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest.json version $VERSION."
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" != "tag" ] && gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::Release $VERSION already exists. Bump the version in manifest.json first."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "$VERSION" in *-*) PRE="--prerelease" ;; esac
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" main.js manifest.json styles.css --clobber
          else
            gh release create "$VERSION" --title "$VERSION" --target "$GITHUB_SHA" --generate-notes $PRE main.js manifest.json styles.css
          fi
