# Push a tag equal to manifest.json's version (no leading "v"): checks, builds and publishes a release with
# main.js, manifest.json and styles.css — what BRAT downloads. Tags like 0.3.0-beta.1 become prereleases.
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tag matches manifest.json
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "${GITHUB_REF_NAME}" != "$VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest.json version $VERSION."
            exit 1
          fi

      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "${GITHUB_REF_NAME}" in *-*) PRE="--prerelease" ;; esac
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" main.js manifest.json styles.css --clobber
          else
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --target "$GITHUB_SHA" --generate-notes $PRE main.js manifest.json styles.css
          fi
